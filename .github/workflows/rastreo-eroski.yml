name: Rastreo automático de Eroski

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: comparador
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: comparador/package-lock.json
      - run: npm ci
      - run: npm run rastreo:eroski:automatico
        env:
          COMPARADOR_URL: https://comparador.kintela.es
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
